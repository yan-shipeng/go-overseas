<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboard · Strategy Simulation</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0d;color:#8aa;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center}
  a{color:#34d399}
</style>
</head>
<body>
  <p>Opening the leaderboard… <a id="go" href="#">Continue</a></p>
  <script>
    (function () {
      var FALLBACK = 'https://a38ce4f671f549b88e59db228d537b00.sg2.agentos-app.run/en/leaderboard';
      function go(url) { location.replace(url); }
      fetch('../current.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var u = (j && j.url) ? j.url.replace(/\/+$/, '') + '/leaderboard' : FALLBACK;
          document.getElementById('go').href = u;
          go(u);
        })
        .catch(function () { document.getElementById('go').href = FALLBACK; go(FALLBACK); });
    })();
  </script>
</body>
</html>
