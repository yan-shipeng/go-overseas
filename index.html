<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Global Integration Challenge · Strategy Simulation</title>
  <meta name="description" content="EMBA strategy implementation simulation (English) — lead a cross-border integration, convert 12 key stakeholders within 60 resource units, and compare your strategy with peers." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050d0f;
      color: #d8eef4;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #050d0f;
      color: #0d8b96;
      font-size: 1rem;
      letter-spacing: 0.05em;
      z-index: 10;
      transition: opacity 0.45s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid rgba(13, 139, 150, .25);
      border-top-color: #0d8b96;
      border-radius: 50%;
      animation: sp 0.9s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    noscript { display: block; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <div>Loading simulation…</div>
  </div>
  <iframe
    id="app"
    src="https://58223f2dedd349988e3c9097a3c145e5.sg2.agentos-app.run/en"
    title="Global Integration Challenge"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    onload="document.getElementById('loading').classList.add('hidden')"
  ></iframe>
  <noscript>This simulation requires JavaScript. Please enable it and reload.</noscript>
  <script>
    /* Failsafe: never leave the spinner covering a page that actually loaded. */
    setTimeout(function () {
      var l = document.getElementById('loading');
      if (l) l.classList.add('hidden');
    }, 12000);
  </script>
</body>
</html>
